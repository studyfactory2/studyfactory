name: Deploy

on:
  push:
    branches:
      - deploy

concurrency:
  group: studyfactory-production-deploy
  cancel-in-progress: false

jobs:
  cloudfront-api-routing:
    needs: backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure CloudFront API origin
        run: .github/scripts/configure-cloudfront-api-origin.sh
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
          EC2_HOST: ${{ secrets.EC2_HOST }}

  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Test backend
        run: ./gradlew test

      - name: Build backend jar
        run: ./gradlew bootJar -x test

      - name: Prepare backend deploy files
        run: |
          rm -rf deploy
          mkdir -p deploy/migrations
          cp Dockerfile compose.prod.yml deploy/
          cp build/libs/*.jar deploy/app.jar
          cp db/migrations/*.sql deploy/migrations/

      - name: Prepare backend directory on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -eu
            rm -rf /home/${{ secrets.EC2_USER }}/studyfactory/backend
            mkdir -p /home/${{ secrets.EC2_USER }}/studyfactory/backend

      - name: Copy backend files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "backend/deploy/*"
          target: "/home/${{ secrets.EC2_USER }}/studyfactory/backend"
          strip_components: 2

      - name: Restart backend on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -eu
            cd /home/${{ secrets.EC2_USER }}/studyfactory/backend
            cat > .env <<'EOF'
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
            STUDY_PRESENCE_QR_SECRET=${{ secrets.STUDY_PRESENCE_QR_SECRET }}
            STUDY_PRESENCE_AUTO_CLOSE_ENABLED=${{ vars.STUDY_PRESENCE_AUTO_CLOSE_ENABLED }}
            EOF
            chmod 600 .env
            docker compose --env-file .env -f compose.prod.yml up -d postgres
            for attempt in $(seq 1 30); do
              if docker compose --env-file .env -f compose.prod.yml exec -T postgres sh -c 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"' > /dev/null; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "PostgreSQL did not become ready in time."
                exit 1
              fi
              sleep 2
            done
            mkdir -p /home/${{ secrets.EC2_USER }}/studyfactory/backups
            backup_file="/home/${{ secrets.EC2_USER }}/studyfactory/backups/pre-deploy-${{ github.run_id }}-${{ github.run_attempt }}.dump"
            docker compose --env-file .env -f compose.prod.yml exec -T postgres sh -c 'pg_dump --format=custom -U "$POSTGRES_USER" -d "$POSTGRES_DB"' > "$backup_file"
            test -s "$backup_file"
            chmod 600 "$backup_file"
            echo "PostgreSQL backup created: $backup_file"
            if docker image inspect studyfactory-backend:latest > /dev/null 2>&1; then
              docker tag studyfactory-backend:latest studyfactory-backend:rollback
            fi
            restore_previous_backend() {
              if ! docker image inspect studyfactory-backend:rollback > /dev/null 2>&1; then
                echo "No previous backend image is available for rollback."
                return 1
              fi
              echo "Restoring previous backend image."
              docker tag studyfactory-backend:rollback studyfactory-backend:latest
              if ! docker compose --env-file .env -f compose.prod.yml up -d --no-build --force-recreate backend; then
                echo "Previous backend image could not be recreated."
                return 1
              fi
              for attempt in $(seq 1 30); do
                if curl --fail --silent --connect-timeout 2 --max-time 5 http://127.0.0.1:8080/api/branches > /dev/null; then
                  sleep 5
                  if curl --fail --silent --connect-timeout 2 --max-time 5 http://127.0.0.1:8080/api/branches > /dev/null; then
                    echo "Previous backend image restored successfully."
                    return 0
                  fi
                fi
                sleep 2
              done
              echo "Previous backend image also failed its health check."
              docker compose --env-file .env -f compose.prod.yml logs --tail=100 backend
              return 1
            }
            for migration in migrations/*.sql; do
              echo "Applying database migration: $migration"
              docker compose --env-file .env -f compose.prod.yml exec -T postgres sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' < "$migration"
            done
            if ! docker compose --env-file .env -f compose.prod.yml up -d --build --remove-orphans; then
              echo "Backend replacement failed before health verification."
              restore_previous_backend || true
              exit 1
            fi
            for attempt in $(seq 1 30); do
              if curl --fail --silent --connect-timeout 2 --max-time 5 http://127.0.0.1:8080/api/branches > /dev/null; then
                sleep 5
                if curl --fail --silent --connect-timeout 2 --max-time 5 http://127.0.0.1:8080/api/branches > /dev/null; then
                  exit 0
                fi
              fi
              sleep 2
            done
            echo "Backend did not become healthy in time."
            docker compose --env-file .env -f compose.prod.yml logs --tail=100 backend
            restore_previous_backend || true
            exit 1
