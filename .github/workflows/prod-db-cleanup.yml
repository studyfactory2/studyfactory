name: Production DB member cleanup

on:
  push:
    branches:
      - deploy
    paths:
      - .github/workflows/prod-db-cleanup.yml

permissions:
  actions: read
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for application deployment
        uses: actions/github-script@v7
        with:
          script: |
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            let deployRun;

            for (let attempt = 0; attempt < 60; attempt += 1) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: context.sha,
                event: 'push',
                per_page: 20,
              });
              deployRun = response.data.workflow_runs.find((run) => run.name === 'Deploy');

              if (deployRun?.status === 'completed') break;
              await sleep(5000);
            }

            if (!deployRun || deployRun.status !== 'completed' || deployRun.conclusion !== 'success') {
              core.setFailed(`Deploy workflow did not complete successfully: ${deployRun?.status ?? 'not found'} / ${deployRun?.conclusion ?? 'unknown'}`);
            }

      - name: Clean production member data
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker exec -i studyfactory-postgres sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL'
            BEGIN;

            CREATE TEMP TABLE keep_members AS
            SELECT id, name
            FROM members
            WHERE name IN ('김지원', '김회원', '김태환');

            DO $$
            DECLARE
              matched_count integer;
              matched_name_count integer;
            BEGIN
              SELECT COUNT(*), COUNT(DISTINCT name)
              INTO matched_count, matched_name_count
              FROM keep_members;

              IF matched_count <> 3 OR matched_name_count <> 3 THEN
                RAISE EXCEPTION 'Cleanup aborted: expected exactly one account for each keep name, found % rows across % names', matched_count, matched_name_count;
              END IF;
            END
            $$;

            SELECT 'before' AS phase, id, name, role, seat_number
            FROM members
            ORDER BY id;

            UPDATE seats
            SET member_id = NULL
            WHERE member_id IS NOT NULL;

            UPDATE members
            SET seat_number = NULL
            WHERE id IN (SELECT id FROM keep_members);

            DELETE FROM todo_replies
            WHERE member_id NOT IN (SELECT id FROM keep_members)
               OR todo_item_id IN (
                    SELECT id
                    FROM todo_items
                    WHERE target_member_id NOT IN (SELECT id FROM keep_members)
                       OR created_by_member_id NOT IN (SELECT id FROM keep_members)
                       OR completed_by_member_id NOT IN (SELECT id FROM keep_members)
               );

            DELETE FROM todo_items
            WHERE target_member_id NOT IN (SELECT id FROM keep_members)
               OR created_by_member_id NOT IN (SELECT id FROM keep_members)
               OR completed_by_member_id NOT IN (SELECT id FROM keep_members);

            DO $$
            DECLARE
              target_column record;
            BEGIN
              FOR target_column IN
                SELECT table_name, column_name
                FROM information_schema.columns
                WHERE table_schema = 'public'
                  AND column_name LIKE '%member_id'
                  AND table_name NOT IN ('members', 'seats', 'todo_items', 'todo_replies')
                ORDER BY table_name, column_name
              LOOP
                EXECUTE format(
                  'DELETE FROM %I WHERE %I IS NOT NULL AND %I NOT IN (SELECT id FROM keep_members)',
                  target_column.table_name,
                  target_column.column_name,
                  target_column.column_name
                );
              END LOOP;
            END
            $$;

            DELETE FROM members
            WHERE id NOT IN (SELECT id FROM keep_members);

            DO $$
            DECLARE
              remaining_count integer;
              assigned_member_count integer;
              assigned_seat_count integer;
            BEGIN
              SELECT COUNT(*) INTO remaining_count FROM members;
              SELECT COUNT(*) INTO assigned_member_count FROM members WHERE seat_number IS NOT NULL;
              SELECT COUNT(*) INTO assigned_seat_count FROM seats WHERE member_id IS NOT NULL;

              IF remaining_count <> 3 OR assigned_member_count <> 0 OR assigned_seat_count <> 0 THEN
                RAISE EXCEPTION 'Cleanup verification failed: members %, member seats %, assigned seats %', remaining_count, assigned_member_count, assigned_seat_count;
              END IF;
            END
            $$;

            SELECT 'after' AS phase, id, name, role, seat_number
            FROM members
            ORDER BY id;

            COMMIT;
            SQL
