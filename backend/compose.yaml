services:
  postgres:
    image: 'postgres:16-alpine'
    environment:
      - 'POSTGRES_DB=studyfactory'
      - 'POSTGRES_PASSWORD=studyfactory'
      - 'POSTGRES_USER=studyfactory'
    ports:
      - '5432:5432'
    volumes:
      - studyfactory_postgres_data:/var/lib/postgresql/data

volumes:
  studyfactory_postgres_data:
