spring:
  datasource:
    url: jdbc:h2:mem:studyfactory-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

jwt:
  secret: studyfactory-test-secret-key-for-jwt-token-generation
  access-expiration-millis: 3153600000000
  refresh-expiration-millis: 3153600000000
