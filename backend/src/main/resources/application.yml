spring:
  application:
    name: studyfactory
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/${DB_NAME:studyfactory}
    username: ${DB_USERNAME:studyfactory}
    password: ${DB_PASSWORD:studyfactory}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

jwt:
  secret: studyfactory-local-development-secret-key
  access-expiration-millis: 3600000
  refresh-expiration-millis: 1209600000
