spring:
  application:
    name: studyfactory
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:studyfactory}
    username: ${DB_USERNAME:studyfactory}
    password: ${DB_PASSWORD:studyfactory}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

jwt:
  secret: ${JWT_SECRET:studyfactory-local-development-secret-key}
  access-expiration-millis: 3600000
  refresh-expiration-millis: 1209600000

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
